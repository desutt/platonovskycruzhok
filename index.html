<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прослушивание треков</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      opacity: 0.6;
      font-size: 0.9rem;
      margin-bottom: 32px;
      text-align: center;
    }
    .track {
      background: #262626;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .track-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      text-align: center;
    }
    audio {
      width: 100%;
      outline: none;
    }
    .footer {
      opacity: 0.5;
      font-size: 0.8rem;
      margin-top: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Прослушивание треков</h1>
  <p class="subtitle">Наденьте наушники и нажмите Play</p>

  <div class="track">
    <div class="track-title">🎧 Андрей</div>
    <audio controls preload="metadata">
      <source src="track1.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудио.
    </audio>
  </div>

  <div class="track">
    <div class="track-title">🎧 Вася</div>
    <audio controls preload="metadata">
      <source src="track2.mp3" type="audio/mpeg">
      Ваш браузер не поддерживает аудио.
    </audio>
  </div>

  <p class="footer">Слушайте внимательно и сравните оба трека</p>
</body>
</html>
